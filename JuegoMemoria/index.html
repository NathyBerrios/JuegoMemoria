<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Memoria</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>🧠 Juego de Memoria</h1>
  </header>

  <main>

    <section aria-label="Controles del juego">
      <div id="controles">

        <label for="inputNombre" class="sr-only">Tu nombre</label>
        <input
          type="text"
          id="inputNombre"
          placeholder="Escribe tu nombre..."
          maxlength="30"
        >

        <label for="selectDificultad" class="sr-only">Dificultad</label>
        <select id="selectDificultad">
          <option value="facil">Fácil (4 pares)</option>
          <option value="normal" selected>Normal (8 pares)</option>
          <option value="dificil">Difícil (12 pares)</option>
        </select>

        <button id="btnIniciar" type="button">Iniciar juego</button>
      </div>
    </section>

    <p id="movimientos" aria-live="polite">Movimientos: 0</p>


    <section aria-label="Tablero de juego">
      <div id="tablero" role="grid"></div>
    </section>

    <p id="mensaje" aria-live="assertive"></p>

  </main>

  <footer>
    <p id="hint">Tip: presiona <kbd>R</kbd> para reiniciar rápido</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
