<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Memoria — versión a auditar</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:540px;margin:40px auto;padding:0 16px;color:#222}
  h1{font-size:1.4rem}
  .fila{display:flex;gap:8px;margin-bottom:16px}
  input{flex:1;padding:8px 10px;font-size:1rem;border:1px solid #bbb;border-radius:6px}
  button{padding:8px 12px;font-size:1rem;cursor:pointer;border:1px solid #888;border-radius:6px;background:#f3f3f3}
  #tablero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
  .carta{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;background:#2b3a42;color:#fff;border-radius:10px;cursor:pointer;user-select:none}
  .carta.volteada{background:#e8eef0;color:#222}
  .carta.encontrada{background:#cdebd7;color:#222;cursor:default}
  #movimientos{color:#666;font-size:.9rem;margin-top:14px}
  #mensaje{font-size:1.1rem;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<h1>Juego de Memoria</h1>

<div class="fila">
  <input id="nombre" placeholder="Tu nombre...">
  <button id="iniciar">Iniciar / Reiniciar</button>
</div>

<div id="tablero"></div>
<p id="movimientos"></p>
<p id="mensaje"></p>


<script>
  const EMOJIS = ['🍎', '🚀', '🐱', '🌵', '🎲', '🎧', '⚽', '🍕']; // 8 pares = 16 cartas

  // BUG (Arquitectura): las variables estaban sueltas una por una.
  // FIX: se agrupan en un objeto const state = {}
  // Ventaja: toda la información del juego vive en un solo lugar.
  // Es más fácil de leer, de reiniciar y de depurar.
  const state = {
    nombre: '',
    cartas: [],
    volteadas: [],
    movimientos: 0,
    bloqueado: false
  };

  const tablero = document.getElementById('tablero');

  document.getElementById('iniciar').addEventListener('click', function () {
    // FIX: leemos desde state en vez de variables sueltas
    state.nombre    = document.getElementById('nombre').value.trim();
    state.cartas    = [];
    state.volteadas = [];
    state.movimientos = 0;
    state.bloqueado   = false;

    EMOJIS.forEach(function (e) {
      state.cartas.push({ emoji: e, encontrada: false });
      state.cartas.push({ emoji: e, encontrada: false });
    });
    state.cartas.sort(function () { return Math.random() - 0.5; });
  
    // FIX (Seguridad): textContent en vez de innerHTML para limpiar el mensaje
    document.getElementById('mensaje').textContent = '';
    render();
  });

  function render() {
      // Nota: este innerHTML = '' está bien SOLO aquí, al iniciar la partida.
    // El problema en el original era llamarlo en cada click.
    tablero.innerHTML = '';
    for (let i = 0; i < state.cartas.length; i++) {
      const div = document.createElement('div');
      div.className = 'carta';
      div.dataset.indice = i;
      div.textContent = state.cartas[i].encontrada ? state.cartas[i].emoji : '?';
      tablero.appendChild(div);
    }
    document.getElementById('movimientos').textContent = 'Movimientos: ' + state.movimientos;
  }

  // FIX (Arquitectura — delegación de eventos):
  // BUG original: había un addEventListener por cada carta dentro de render().
  // FIX: un solo listener en el tablero que detecta que carta fue clickeada.
  tablero.addEventListener('click', function(evento) {
    const div = evento.target;
    // Solo actuamos si el click fue sobre una carta
    if (!div.classList.contains('carta')) return;
    voltearCarta(div);
  });

  function voltearCarta(div) {
    const i = Number(div.dataset.indice);
    // FIX (Bug funcional — bloqueo): sin este chequeo se podía voltear
    // una tercera carta mientras el setTimeout aún no había corrido.
    if (state.bloqueado) return;

    // FIX (Bug funcional — doble click): sin este chequeo, hacer doble click
    // en la misma carta la agregaba dos veces a volteadas[], y al comparar
    // a === b el emoji coincidía consigo mismo.
    if (state.cartas[i].encontrada) return;
    if (state.volteadas.includes(i)) return;
    div.textContent = state.cartas[i].emoji;
    div.classList.add('volteada');
    state.volteadas.push(i);

    if (state.volteadas.length === 2) {
      state.movimientos++;
      document.getElementById('movimientos').textContent = 'Movimientos: ' + state.movimientos;

      const a = state.volteadas[0];
      const b = state.volteadas[1];

      // FIX (Bug funcional — const divs):
      // BUG original: 'const divs' se declaraba dentro del if de par correcto,
      // pero se usaba también en el else de par incorrecto que está fuera de ese if.
      // Eso causaba un ReferenceError: divs is not defined en el bloque else.
      //
      // FIX: declaramos divs una sola vez aquí arriba, antes del if/else,
      // para que esté disponible en ambos bloques.
      const divs = tablero.children;

      // FIX (Arquitectura): comparamos usando el estado (state.cartas),
      // no el texto del DOM (divs[a].textContent).
      if (state.cartas[a].emoji === state.cartas[b].emoji) {
        // Par correcto
        state.cartas[a].encontrada = true;
        state.cartas[b].encontrada = true;
        divs[a].classList.remove('volteada');
        divs[b].classList.remove('volteada');
        divs[a].classList.add('encontrada');
        divs[b].classList.add('encontrada');
        state.volteadas = [];
        revisarVictoria();

      } else {
        // Par incorrecto: bloqueamos y ocultamos después de 900ms
        state.bloqueado = true; // bloqueamos el tablero

        setTimeout(function () {
          divs[a].textContent = '?';
          divs[b].textContent = '?';
          divs[a].classList.remove('volteada');
          divs[b].classList.remove('volteada');
          state.volteadas = [];
                    // FIX (Bug funcional — bloqueado en setTimeout):
          // BUG original: bloqueado = false nunca se ejecutaba dentro del setTimeout, 
          // por lo que el tablero quedaba bloqueado para siempre
          // después del primer par incorrecto
          // FIX: desbloquear DENTRO del setTimeout, después de ocultar las cartas.
          state.bloqueado = false; 
        }, 800);
      }
    }
  }

  function revisarVictoria() {
    const todasEncontradas = state.cartas.every(function (c) { return c.encontrada; });
    if (todasEncontradas) {
      // BUG (Seguridad — XSS):
      // El original usaba: mensaje.innerHTML = '¡Ganaste, ' + nombre + '! 🎉'
      // Si el usuario escribía HTML en el input ese código se ejecutaba en el navegador.
      // FIX: textContent trata todo como texto plano. Nunca ejecuta HTML.
      const nombreMostrar = state.nombre !== '' ? state.nombre : 'Jugador';
      document.getElementById('mensaje').textContent = '¡Ganaste, ' + nombreMostrar + '! 🎉';
    }
  }
</script>
</body>
</html>
